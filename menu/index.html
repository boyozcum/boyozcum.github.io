<style>
:root{
  --dough:#F5EAD6; --crumb:#FBF5EA; --espresso:#2E1C12; --roast:#6E5040;
  --crust:#9A5514; --crust-soft:#EBCB98; --sesame:#E3CFA9; --olive:#556128; --olive-soft:#E3E6C8;
  --shadow:0 1px 0 rgba(46,28,18,.06), 0 8px 24px -12px rgba(46,28,18,.25);
  --serif:"Alegreya", Georgia, "Times New Roman", serif;
  --sans:"Alegreya Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --bar-h:52px;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --dough:#1E1611; --crumb:#2A1F18; --espresso:#F2E6D3; --roast:#C4AA90;
    --crust:#E2A157; --crust-soft:#4A3420; --sesame:#43342A; --olive:#A9B86A; --olive-soft:#33361F;
    --shadow:0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--dough);color:var(--espresso);font-family:var(--sans);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--dough)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--crust);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
[hidden]{display:none !important}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;padding:40px 0 28px}
.hero .wrap{position:relative;z-index:1}
.spiral{position:absolute;right:-90px;top:-40px;width:340px;height:340px;z-index:0;pointer-events:none}
.spiral path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.spiral .coil{stroke:var(--crust-soft);stroke-width:22}
.spiral .edge{stroke:var(--crust);stroke-width:2.5;opacity:.55}
@media (min-width:700px){.spiral{right:-40px;top:-30px;width:420px;height:420px}}
.brand{font-family:var(--serif);font-weight:800;font-size:clamp(3rem,13vw,5.4rem);line-height:.9;letter-spacing:-.02em;margin:0}
.brand-sub{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--roast);margin:6px 0 0}
.tagline{font-family:var(--serif);font-weight:500;font-size:clamp(1.35rem,4.8vw,1.75rem);line-height:1.2;margin:22px 0 0;max-width:15em}
.status{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;font-weight:500;font-size:.95rem}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--roast)}
.status.is-open .dot{background:var(--olive)}
.about{margin-top:18px;max-width:34em;background:var(--crumb);border-radius:16px;box-shadow:var(--shadow)}
.about summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
.about summary::-webkit-details-marker{display:none}
.about summary svg{transition:transform .2s ease;flex:none}
.about[open] summary svg{transform:rotate(180deg)}
.about p{margin:0;padding:0 18px 16px;font-family:var(--serif);font-size:1.05rem;line-height:1.6;color:var(--roast)}

/* ---------- Notices ---------- */
.notice{margin:0 0 16px;padding:12px 16px;border-radius:12px;background:var(--crust-soft);color:var(--espresso);font-size:.95rem;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice button{border:0;background:var(--espresso);color:var(--dough);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700}

/* ---------- Search + filters ---------- */
.tools{padding-top:4px;padding-bottom:14px}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--sesame);background:var(--crumb);padding:0 44px 0 44px;font-size:1rem}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input::placeholder{color:var(--roast);opacity:.85}
.search input:focus{outline:none;border-color:var(--crust)}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--roast)}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:10px;background:transparent;cursor:pointer;color:var(--roast);display:grid;place-items:center}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{border:1.5px solid var(--sesame);background:transparent;border-radius:999px;padding:6px 14px;font-size:.95rem;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--espresso);border-color:var(--espresso);color:var(--dough)}

/* ---------- Sticky category bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--dough);border-bottom:1.5px solid var(--sesame)}
.bar .wrap{display:flex;align-items:center;gap:8px;height:var(--bar-h);padding-right:12px}
.tabs{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:500;font-size:.98rem;cursor:pointer;color:var(--roast);white-space:nowrap}
.tab[aria-current="true"]{background:var(--crust-soft);color:var(--espresso);font-weight:700}
.lang-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--sesame);background:var(--crumb);border-radius:999px;height:36px;padding:0 12px;cursor:pointer;font-weight:700;font-size:.9rem}

/* ---------- Menu ---------- */
main{padding:8px 0 40px}
.cat{padding-top:26px}
.cat-head{display:flex;align-items:center;gap:12px;margin:0 0 6px}
.cat-head svg{color:var(--crust);flex:none}
.cat-title{font-family:var(--serif);font-weight:700;font-size:1.65rem;margin:0;line-height:1.2}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:16px 0;border-bottom:1px dashed var(--sesame);align-items:start}
.item.has-photo{grid-template-columns:76px 1fr auto}
.item:last-child{border-bottom:0}
.thumb{width:76px;height:76px;border-radius:14px;object-fit:cover;background:var(--crust-soft);grid-row:span 1}
.item-head{display:flex;align-items:baseline;gap:8px}
.item-name{font-family:var(--serif);font-weight:700;font-size:1.2rem;line-height:1.25;margin:0}
.leader{flex:1;min-width:12px;border-bottom:2px dotted var(--sesame);transform:translateY(-4px)}
.price{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--crust);white-space:nowrap;font-variant-numeric:tabular-nums}
.item-desc{margin:4px 0 0;color:var(--roast);font-size:.98rem;line-height:1.45;max-width:36em}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:.85rem}
.tag{padding:2px 9px;border-radius:999px;font-weight:700;background:var(--crust-soft);color:var(--espresso)}
.tag.veg{background:var(--olive-soft);color:var(--olive)}
.allergens{color:var(--roast)}
.item-action{display:flex;align-items:center;padding-top:2px}
.add{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--espresso);background:transparent;cursor:pointer;display:grid;place-items:center}
.add:active{transform:scale(.94)}
.stepper{display:flex;align-items:center;border-radius:12px;background:var(--espresso);color:var(--dough);height:40px}
.stepper button{width:36px;height:40px;border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center}
.stepper output{min-width:20px;text-align:center;font-weight:700}
.is-out .item-name,.is-out .item-desc,.is-out .price{opacity:.5}
.is-out .price{text-decoration:line-through}
.sold{font-size:.85rem;font-weight:700;color:var(--roast);border:1.5px solid var(--sesame);border-radius:999px;padding:4px 10px;white-space:nowrap}
.empty{text-align:center;padding:40px 0;color:var(--roast)}
.empty p{margin:0 0 12px}
.empty button,.error button{border:1.5px solid var(--espresso);background:transparent;border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700}
.loading{padding:40px 0;text-align:center;color:var(--roast)}

/* ---------- Footer ---------- */
footer{border-top:1.5px solid var(--sesame);padding:28px 0 calc(110px + env(safe-area-inset-bottom,0px))}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.action{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--crumb);box-shadow:var(--shadow);color:var(--espresso);text-decoration:none;font-weight:700}
.action svg{color:var(--crust);flex:none}
.notes p{margin:0 0 8px;color:var(--roast);font-size:.95rem}
.sign{margin-top:22px;font-family:var(--serif);font-style:italic;color:var(--roast)}

/* ---------- Cart bar ---------- */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.cartbar button{display:flex;width:100%;max-width:736px;margin:0 auto;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:16px;background:var(--espresso);color:var(--dough);padding:14px 18px;font-weight:700;font-size:1.02rem;cursor:pointer;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.cartbar .count{background:var(--crust);color:#fff;border-radius:999px;padding:2px 10px;font-size:.9rem}
@media (prefers-color-scheme: dark){.cartbar .count{color:#1E1611}}

/* ---------- Dialogs ---------- */
dialog{border:0;padding:0;background:var(--crumb);color:var(--espresso);width:100%;max-width:560px;max-height:88vh;margin:auto auto 0;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.4)}
@media (min-width:640px){dialog{margin:auto;border-radius:22px}}
dialog::backdrop{background:rgba(30,22,17,.55)}
dialog[open]{animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;max-height:88vh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{font-family:var(--serif);font-size:1.5rem;margin:0}
.x{width:40px;height:40px;border:0;border-radius:12px;background:var(--dough);cursor:pointer;display:grid;place-items:center}
.sheet-body{overflow:auto;flex:1}
.langs{list-style:none;margin:0;padding:0}
.langs button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;padding:14px 8px;border-bottom:1px dashed var(--sesame);font-size:1.1rem;cursor:pointer}
.langs button[aria-current="true"]{font-weight:700;color:var(--crust)}
.hint{margin:0 0 12px;color:var(--roast);font-size:.95rem}
.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--sesame)}
.line .n{font-weight:700}
.line .p{font-variant-numeric:tabular-nums;color:var(--roast);min-width:60px;text-align:right}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:.9rem;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--sesame);background:var(--dough);border-radius:12px;padding:10px 12px;font-size:1rem}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--crust)}
.total{display:flex;justify-content:space-between;font-family:var(--serif);font-size:1.3rem;font-weight:700;margin:16px 0 4px}
.sheet-foot{padding-top:12px;display:flex;flex-direction:column;gap:8px}
.send{display:flex;align-items:center;justify-content:center;gap:10px;background:#1F7A4C;color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:14px;font-size:1.05rem}
.ghost{border:0;background:transparent;color:var(--roast);padding:8px;cursor:pointer;text-decoration:underline}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>

function spiralD(cx, cy, turns, gap, start=0.4){
  const pts = [], steps = Math.round(turns*90);
  const max = turns*2*Math.PI;
  for (let i=0;i<=steps;i++){
    const th = start + (max-start)*i/steps;
    const r = gap*th/(2*Math.PI);
    pts.push((cx + r*Math.cos(th)).toFixed(1) + " " + (cy + r*Math.sin(th)).toFixed(1));
  }
  return "M" + pts.join(" L");
}

  slice:`<path d="M3 16.5 20.5 8.5v10H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 16.5h17.5M8 5.5q1.5-2 3 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`,
  tea:`<path d="M8.5 3.5h7c0 3.6-2 4.6-2 7.5s2 3.9 2 7.5h-7c0-3.6 2-4.6 2-7.5s-2-3.9-2-7.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`,
  plus:`<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>`,
  check:`<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`,
  minus:`<path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>`,
  pin:`<path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/>`,
  star:`<path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>`,
  phone:`<path d="M6.6 3.5h2.6l1.3 4.2-2 1.4a12.4 12.4 0 0 0 6.4 6.4l1.4-2 4.2 1.3v2.6A2.1 2.1 0 0 1 18.3 20 15.6 15.6 0 0 1 4 5.7a2.1 2.1 0 0 1 2.6-2.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>`,
  insta:`<rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="7" r="1.1" fill="currentColor"/>`
};
const icon = (n, size=24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||ICONS.ring}</svg>`;

/* ---------------- CSV ---------------- */
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function toItems(text){
  const rows = parseCSV(text.replace(/^\uFEFF/, ""));
  if (!rows.length) throw new Error("empty");
  const head = rows[0].map(h => h.trim().toLowerCase());
  if (!head.includes("ad_tr") || !head.includes("kategori")) throw new Error("bad header");
  const out = [];
  rows.slice(1).forEach((r, idx) => {
    const o = {}; head.forEach((h,i) => o[h] = (r[i] || "").trim());
    const status = norm(o.durum || "aktif");
    if (!o.ad_tr || status === "gizli") return;
    const names = {}, descs = {};
    LANGS.forEach(l => { names[l.code] = o["ad_"+l.code] || ""; descs[l.code] = o["aciklama_"+l.code] || ""; });
    const raw = (o.fiyat || "").replace(/[^\d.,]/g, "");
    let price = null;
    if (raw){
      const v = raw.includes(",") ? raw.replace(/\./g,"").replace(",",".") : raw;
      const n = parseFloat(v); if (!isNaN(n) && n > 0) price = n;
    }
    const cat = norm(o.kategori).replace(/\s+/g,"");
    out.push({
      id: cat + "-" + norm(o.ad_tr).replace(/[^a-z0-9]+/g,"-"),
      cat, order: parseFloat(o.sira) || (idx+1), soldOut: status.startsWith("tukendi"),
      names, descs, price,
      allergens: norm(o.alerjenler).split(/[\s,;]+/).filter(Boolean),
      tags: norm(o.etiketler).split(/[\s,;]+/).filter(Boolean),
      photo: o.foto || ""
    });
  });
  return out;
}
const nm = it => it.names[lang] || it.names.tr;
const ds = it => it.descs[lang] || it.descs.tr;

/* ---------------- Rendering ---------------- */
function catDefs(){
  const known = CATEGORIES.map(c => c.key);
  const extra = [...new Set(items.map(i => i.cat))].filter(k => !known.includes(k))
    .map(k => ({key:k, icon:"ring", name:{tr: k.charAt(0).toLocaleUpperCase("tr") + k.slice(1)}}));
  return CATEGORIES.concat(extra).filter(c => items.some(i => i.cat === c.key));
}
const catName = c => c.name[lang] || c.name.en || c.name.tr;

function matches(it, q){
  for (const f of activeFilters){
    if (f === "vejetaryen" && !(it.tags.includes("vejetaryen") || it.tags.includes("vegan"))) return false;
    if (f !== "vejetaryen" && !it.tags.includes(f)) return false;
  }
  if (!q) return true;
  const hay = norm(Object.values(it.names).join(" ") + " " + Object.values(it.descs).join(" "));
  return q.split(/\s+/).every(w => hay.includes(w));
}

function itemHTML(it){
  const name = nm(it), desc = ds(it), qty = +(cart.get(it.id) || 0);
  const tags = it.tags.filter(k => TAGS[k]).map(k =>
    `<span class="tag${k==="vegan"||k==="vejetaryen" ? " veg" : ""}">${esc(TAGS[k][lang])}</span>`).join("");
  const al = it.allergens.map(k => ALLERGENS[k] ? ALLERGENS[k][lang] : k);
  const allergens = al.length ? `<span class="allergens">${esc(t("contains",{list: al.join(", ")}))}</span>` : "";
  let action = "";
  if (it.soldOut) action = `<span class="sold">${esc(t("soldOut"))}</span>`;
  else if (orderingOn() && it.price != null){
    action = qty
      ? `<div class="stepper"><button type="button" data-dec="${it.id}" aria-label="${esc(t("less"))}">${icon("minus",18)}</button><output aria-live="polite">${qty}</output><button type="button" data-inc="${it.id}" aria-label="${esc(t("more"))}">${icon("plus",18)}</button></div>`
      : `<button type="button" class="add" data-inc="${it.id}" aria-label="${esc(t("add",{name}))}">${icon("plus",20)}</button>`;
  }
  return `<li class="item${it.photo?" has-photo":""}${it.soldOut?" is-out":""}">
    ${it.photo ? `<img class="thumb" src="${esc(it.photo)}" alt="" loading="lazy" decoding="async" onerror="this.remove();this.parentNode&&this.parentNode.classList.remove('has-photo')">` : ""}
    <div>
      <div class="item-head"><h3 class="item-name">${esc(name)}</h3>${it.price!=null?`<span class="leader" aria-hidden="true"></span><span class="price">${esc(money(it.price))}</span>`:""}</div>
      ${desc ? `<p class="item-desc">${esc(desc)}</p>` : ""}
      ${tags || allergens ? `<div class="meta">${tags}${allergens}</div>` : ""}
    </div>
    <div class="item-action">${action}</div>
  </li>`;
}

function renderMenu(){
  const q = norm($("#q").value.trim());
  const cats = catDefs();
  let html = "", any = false;
  cats.forEach(c => {
    const list = items.filter(i => i.cat === c.key && matches(i, q)).sort((a,b) => a.order - b.order);
    if (!list.length) return;
    any = true;
    html += `<section class="cat" id="cat-${esc(c.key)}" data-cat="${esc(c.key)}">
      <div class="cat-head">${icon(c.icon, 28)}<h2 class="cat-title">${esc(catName(c))}</h2></div>
      <ul class="items">${list.map(itemHTML).join("")}</ul></section>`;
  });
  if (!any && items.length){
    html = `<div class="empty"><p>${esc(t("noResults"))}</p><button type="button" id="resetSearch">${esc(t("showAll"))}</button></div>`;
  }
  $("#menu").innerHTML = html;
  renderTabs();
  observeSections();
}

function renderTabs(){
  const shown = [...document.querySelectorAll("#menu .cat")].map(s => s.dataset.cat);
  const tabs = $("#tabs");
  tabs.setAttribute("aria-label", t("categories"));
  tabs.innerHTML = catDefs().filter(c => shown.includes(c.key))
    .map((c,i) => `<button type="button" class="tab" data-tab="${esc(c.key)}" aria-current="${i===0}">${esc(catName(c))}</button>`).join("");
}

let observer;
function observeSections(){
  if (observer) observer.disconnect();
  if (!("IntersectionObserver" in window)) return;
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) setActiveTab(e.target.dataset.cat); });
  }, {rootMargin: "-80px 0px -65% 0px"});
  document.querySelectorAll("#menu .cat").forEach(s => observer.observe(s));
}
function setActiveTab(key){
  document.querySelectorAll(".tab").forEach(b => {
    const on = b.dataset.tab === key;
    b.setAttribute("aria-current", on);
    if (on){
      const strip = $("#tabs");
      const left = b.offsetLeft - strip.clientWidth/2 + b.clientWidth/2;
      strip.scrollTo({left, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    }
  });
}

function renderChips(){
  $("#chips").innerHTML = FILTERS.map(f =>
    `<button type="button" class="chip" data-filter="${f}" aria-pressed="${activeFilters.has(f)}">${esc(TAGS[f][lang])}</button>`).join("");
}

function renderActions(){
  const a = [];
  const maps = CONFIG.MAPS_URL || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.MAPS_QUERY));
  a.push(`<a class="action" href="${esc(maps)}" target="_blank" rel="noopener">${icon("pin")}${esc(t("directions"))}</a>`);
  if (CONFIG.GOOGLE_REVIEW_URL) a.push(`<a class="action" href="${esc(CONFIG.GOOGLE_REVIEW_URL)}" target="_blank" rel="noopener">${icon("star")}${esc(t("review"))}</a>`);
  if (CONFIG.PHONE) a.push(`<a class="action" href="tel:${esc(CONFIG.PHONE.replace(/[^\d+]/g,""))}">${icon("phone")}${esc(t("call"))}</a>`);
  if (CONFIG.INSTAGRAM) a.push(`<a class="action" href="https://www.instagram.com/${esc(CONFIG.INSTAGRAM)}/" target="_blank" rel="noopener">${icon("insta")}${esc(t("instagram"))}</a>`);
  $("#actions").innerHTML = a.join("");
}

function renderStatus(){
  const h = CONFIG.HOURS, el = $("#status");
  if (!h || !h.open || !h.close){ el.hidden = true; return; }
  const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Istanbul",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const m = (+parts.find(p=>p.type==="hour").value % 24)*60 + +parts.find(p=>p.type==="minute").value;
  const toM = s => { const [a,b] = s.split(":").map(Number); return a*60 + (b||0); };
  const o = toM(h.open), c = toM(h.close);
  const open = o < c ? (m >= o && m < c) : (m >= o || m < c);
  el.hidden = false;
  el.classList.toggle("is-open", open);
  $("#statusText").textContent = open ? `${t("openNow")}. ${t("closesAt",{t:h.close})}` : `${t("closedNow")}. ${t("opensAt",{t:h.open})}`;
}

function renderNotice(kind){
  const el = $("#notice");
  if (kind === "demo") el.innerHTML = `<div class="notice" role="status"><span>${esc(t("demo"))}</span></div>`;
  else if (kind === "offline") el.innerHTML = `<div class="notice" role="status"><span>${esc(t("offline"))}</span><button type="button" data-retry>${esc(t("retry"))}</button></div>`;
  else el.innerHTML = "";
}

/* ---------------- Cart ---------------- */
function orderingOn(){ return !!CONFIG.WHATSAPP; }
function cartLines(){
  const out = [];
  cart.forEach((q, id) => { const it = items.find(i => i.id === id); if (it && !it.soldOut && it.price != null && q > 0) out.push({it, q:+q}); });
  return out;
}
function saveCart(){ store.set("bz-cart", Object.fromEntries(cart)); }
function setQty(id, q){
  if (q <= 0) cart.delete(id); else cart.set(id, Math.min(q, 99));
  saveCart(); renderMenuKeepScroll(); renderCart();
}
function renderMenuKeepScroll(){ const y = window.scrollY; renderMenu(); window.scrollTo(0, y); }
function renderCart(){
  const lines = cartLines();
  // drop items that no longer exist
  [...cart.keys()].forEach(id => { if (!lines.some(l => l.it.id === id) && items.length) cart.delete(id); });
  const n = lines.reduce((s,l) => s + l.q, 0);
  const total = lines.reduce((s,l) => s + l.q*l.it.price, 0);
  $("#cartbar").hidden = !orderingOn() || n === 0;
  $("#cartCount").textContent = n;
  $("#cartLabel").textContent = t("viewOrder");
  $("#cartCount").setAttribute("aria-label", plural(n));
  $("#cartTotal").textContent = money(total);
  $("#lines").innerHTML = lines.map(l => `<li class="line"><span class="n">${esc(nm(l.it))}</span>
    <div class="stepper"><button type="button" data-dec="${l.it.id}" aria-label="${esc(t("less"))}">${icon("minus",18)}</button><output>${l.q}</output><button type="button" data-inc="${l.it.id}" aria-label="${esc(t("more"))}">${icon("plus",18)}</button></div>
    <span class="p">${esc(money(l.q*l.it.price))}</span></li>`).join("");
  $("#sheetTotal").textContent = money(total);
  updateSendLink();
  if (n === 0 && $("#cartDialog").open) $("#cartDialog").close();
}
function updateSendLink(){
  const lines = cartLines();
  const total = lines.reduce((s,l) => s + l.q*l.it.price, 0);
  const tr = v => money(v, "tr-TR");
  let msg = "Merhaba, menüden sipariş vermek istiyorum:\n\n";
  msg += lines.map(l => `${l.q} × ${l.it.names.tr} (${tr(l.q*l.it.price)})`).join("\n");
  msg += `\n\nToplam: ${tr(total)}`;
  const p = $("#pickup").value; if (p) msg += `\nTeslim alma: ${p}`;
  const note = $("#note").value.trim(); if (note) msg += `\nNot: ${note}`;
  if (lang !== "tr") msg += `\n\nMüşteri dili: ${LANG_NAME_TR[lang]}`;
  $("#send").href = "https://wa.me/" + CONFIG.WHATSAPP.replace(/\D/g,"") + "?text=" + encodeURIComponent(msg);
}

/* ---------------- Language ---------------- */
function detectLang(){
  const fromUrl = new URLSearchParams(location.search).get("lang");
  const saved = store.get("bz-lang");
  const codes = LANGS.map(l => l.code);
  if (fromUrl && codes.includes(fromUrl)) return fromUrl;
  if (saved && codes.includes(saved)) return saved;
  for (const l of (navigator.languages || [navigator.language || "en"])){
    const c = String(l).slice(0,2).toLowerCase();
    if (codes.includes(c)) return c;
  }
  return "en";
}
function applyLang(code, persist){
  lang = code;
  if (persist) store.set("bz-lang", code);
  document.documentElement.lang = code;
  document.title = "Boyozcum | " + t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-label]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nLabel)));
  $("#q").placeholder = t("search");
  $("#q").setAttribute("aria-label", t("search"));
  $("#qClear").setAttribute("aria-label", t("clearSearch"));
  $("#langCode").textContent = code.toUpperCase();
  $("#langBtn").setAttribute("aria-label", t("language") + ": " + LANGS.find(l=>l.code===code).name);
  $("#langList").innerHTML = LANGS.map(l => `<li><button type="button" lang="${l.code}" data-lang="${l.code}" aria-current="${l.code===code}"><span>${l.name}</span>${l.code===code ? icon("check",20) : ""}</button></li>`).join("");
  renderChips(); renderActions(); renderStatus(); renderNotice(source === "demo" ? "demo" : source === "offline" ? "offline" : "");
  if (items.length) renderMenu();
  renderCart();
}

/* ---------------- Data loading ---------------- */
const CACHE_KEY = "bz-menu-cache-v1";
function setItems(list, src){
  items = list; source = src;
  renderNotice(src === "demo" ? "demo" : src === "offline" ? "offline" : "");
  renderMenu(); renderCart();
}
async function load(){
  if (!CONFIG.SHEET_CSV_URL){ setItems(toItems(DEMO_CSV), "demo"); return; }
  const cached = store.get(CACHE_KEY);
  if (cached && cached.csv){ try{ setItems(toItems(cached.csv), "cache"); }catch(e){} }
  try{
    const url = CONFIG.SHEET_CSV_URL + (CONFIG.SHEET_CSV_URL.includes("?") ? "&" : "?") + "_=" + Math.floor(Date.now()/60000);
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    const list = toItems(text);
    store.set(CACHE_KEY, {csv:text, t:Date.now()});
    setItems(list, "live");
  }catch(err){
    console.warn("Menü yüklenemedi:", err);
    if (items.length) { source = "offline"; renderNotice("offline"); }
    else $("#menu").innerHTML = `<div class="empty error"><p>${esc(t("loadError"))}</p><button type="button" data-retry>${esc(t("retry"))}</button></div>`;
  }
}

/* ---------------- Events ---------------- */
document.addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]");
  if (inc){ setQty(inc.dataset.inc, (+cart.get(inc.dataset.inc) || 0) + 1); return; }
  if (dec){ setQty(dec.dataset.dec, (+cart.get(dec.dataset.dec) || 0) - 1); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab){ const s = document.getElementById("cat-" + tab.dataset.tab); if (s) s.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); setActiveTab(tab.dataset.tab); return; }
  const chip = e.target.closest("[data-filter]");
  if (chip){ const f = chip.dataset.filter; activeFilters.has(f) ? activeFilters.delete(f) : activeFilters.add(f); renderChips(); renderMenu(); return; }
  const l = e.target.closest("[data-lang]");
  if (l){ applyLang(l.dataset.lang, true); $("#langDialog").close(); return; }
  if (e.target.closest("[data-close]")){ e.target.closest("dialog").close(); return; }
  if (e.target.closest("[data-retry]")){ $("#menu").innerHTML = `<p class="loading">…</p>`; load(); return; }
  if (e.target.closest("#resetSearch")){ $("#q").value = ""; $("#qClear").hidden = true; activeFilters.clear(); renderChips(); renderMenu(); return; }
});
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));
$("#langBtn").addEventListener("click", () => $("#langDialog").showModal());
$("#cartOpen").addEventListener("click", () => { renderCart(); $("#cartDialog").showModal(); });
$("#clearCart").addEventListener("click", () => { cart.clear(); saveCart(); renderMenu(); renderCart(); });
$("#pickup").addEventListener("input", updateSendLink);
$("#note").addEventListener("input", updateSendLink);
let qTimer;
$("#q").addEventListener("input", () => {
  $("#qClear").hidden = !$("#q").value;
  clearTimeout(qTimer); qTimer = setTimeout(renderMenu, 120);
});
$("#qClear").addEventListener("click", () => { $("#q").value = ""; $("#qClear").hidden = true; renderMenu(); $("#q").focus(); });

/* ---------------- Hero spiral ---------------- */
(function(){
  const d = spiralD(200, 200, 5.2, 36, 0.9);
  const coil = $("#coil"), edge = $("#coilEdge");
  coil.setAttribute("d", d); edge.setAttribute("d", d);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  [coil, edge].forEach(p => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.animate([{strokeDashoffset: len}, {strokeDashoffset: 0}], {duration: 1600, easing: "cubic-bezier(.3,.7,.2,1)", fill: "forwards"});
  });
})();

/* ---------------- Start ---------------- */
applyLang(detectLang(), false);
load();
setInterval(renderStatus, 60000);
</script>
